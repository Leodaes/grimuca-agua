<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-labelledby="t d" font-family="Archivo, 'Segoe UI', Arial, sans-serif">
  <title id="t">Punto de venta portátil de Grimuca Agua</title>
  <desc id="d">Mostrador pequeño con sombrilla, sobres de medición y un código QR para registrarse.</desc>
  <!-- Paleta Grimuca: azul #12437F, azul claro #2E6DB4, acento naranja #C2410C, papel #F3F6FA. -->
  <rect width="560" height="560" fill="#F3F6FA"/>
  <rect y="470" width="560" height="90" fill="#DDE4EE"/>

  <!-- Sombrilla -->
  <path d="M120 150q160-110 320 0z" fill="#12437F"/>
  <path d="M280 72q-50 30-60 78h120q-10-48-60-78z" fill="#2E6DB4"/>
  <rect x="120" y="150" width="320" height="22" fill="#12437F"/>
  <text x="280" y="167" fill="#FFFFFF" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="3">GRIMUCA AGUA</text>
  <rect x="276" y="172" width="8" height="120" fill="#12437F"/>

  <!-- Mostrador -->
  <rect x="160" y="292" width="240" height="16" fill="#12437F"/>
  <rect x="172" y="308" width="216" height="162" fill="#FFFFFF" stroke="#12437F" stroke-width="3"/>
  <text x="280" y="342" fill="#12437F" font-size="22" font-weight="800" text-anchor="middle">Mide tu agua</text>
  <text x="280" y="366" fill="#12437F" font-size="12" text-anchor="middle">Sobre de medición, envío incluido</text>
  <rect x="198" y="382" width="64" height="64" fill="#FFFFFF" stroke="#12437F" stroke-width="2.5"/>
  <g fill="#12437F">
    <rect x="204" y="388" width="16" height="16"/><rect x="240" y="388" width="16" height="16"/><rect x="204" y="424" width="16" height="16"/>
    <rect x="226" y="412" width="8" height="8"/><rect x="242" y="426" width="8" height="8"/><rect x="230" y="394" width="6" height="6"/><rect x="246" y="410" width="6" height="6"/>
  </g>
  <text x="326" y="408" fill="#12437F" font-size="13" text-anchor="middle">Escanea y</text>
  <text x="326" y="424" fill="#12437F" font-size="13" text-anchor="middle">regístrate</text>
  <rect x="172" y="452" width="216" height="18" fill="#C2410C"/>
  <text x="280" y="466" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">$9 · EN TU FERRETERÍA ALIADA</text>

  <!-- Sobres sobre el mostrador -->
  <rect x="188" y="258" width="58" height="36" fill="#FFFFFF" stroke="#12437F" stroke-width="2.5"/>
  <path d="M188 258l29 19 29-19" fill="none" stroke="#12437F" stroke-width="2.5"/>
  <rect x="314" y="258" width="58" height="36" fill="#FFFFFF" stroke="#12437F" stroke-width="2.5"/>
  <path d="M314 258l29 19 29-19" fill="none" stroke="#12437F" stroke-width="2.5"/>
  <rect x="350" y="246" width="24" height="16" fill="#C2410C"/>
  <text x="362" y="258" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">$9</text>

  <!-- Promotores a los lados -->
  <circle cx="90" cy="320" r="22" fill="#8A5A3C"/>
  <path d="M58 470l4-110c2-18 14-26 28-26s26 8 28 26l4 110z" fill="#2E6DB4"/>
  <rect x="112" y="370" width="30" height="20" fill="#FFFFFF" stroke="#12437F" stroke-width="2"/>
  <circle cx="470" cy="320" r="22" fill="#5B3A29"/>
  <path d="M438 470l4-110c2-18 14-26 28-26s26 8 28 26l4 110z" fill="#2E6DB4"/>

  <text x="280" y="530" fill="#4A5B70" font-size="13" text-anchor="middle">Medición casera orientativa. No reemplaza un análisis de laboratorio.</text>
