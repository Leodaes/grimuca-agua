<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t d" font-family="Archivo, 'Segoe UI', Arial, sans-serif">
  <title id="t">Toldo de campaña de Grimuca Agua en una urbanización</title>
  <desc id="d">Toldo azul con una mesa donde se mide el agua que traen los vecinos y se venden sobres de medición.</desc>
  <!-- Paleta Grimuca: azul #12437F, azul claro #2E6DB4, acento naranja #C2410C, papel #F3F6FA. -->
  <rect width="800" height="560" fill="#F3F6FA"/>
  <!-- Acera y casas al fondo -->
  <rect y="470" width="800" height="90" fill="#DDE4EE"/>
  <g fill="#E6ECF4" stroke="#C9D3E1" stroke-width="2">
    <path d="M520 470V330l70-50 70 50v140z"/>
    <path d="M650 470V350l55-40 55 40v120z"/>
    <path d="M40 470V345l60-45 60 45v125z"/>
  </g>
  <g fill="#C9D3E1"><rect x="565" y="380" width="22" height="28"/><rect x="600" y="380" width="22" height="28"/><rect x="690" y="395" width="20" height="26"/><rect x="85" y="390" width="22" height="28"/></g>

  <!-- Bandera vertical -->
  <rect x="70" y="160" width="10" height="320" fill="#12437F"/>
  <path d="M80 165h58v230l-58-22z" fill="#12437F"/>
  <text x="112" y="380" fill="#FFFFFF" font-size="22" font-weight="800" transform="rotate(-90 112 380)" letter-spacing="2">MIDE TU AGUA</text>

  <!-- Toldo -->
  <path d="M250 70h300l110 110H140z" fill="#12437F"/>
  <path d="M400 70l-75 110h150z" fill="#2E6DB4"/>
  <path d="M250 70l-110 110h75z" fill="#2E6DB4"/>
  <path d="M550 70l110 110h-75z" fill="#2E6DB4"/>
  <rect x="140" y="180" width="520" height="38" fill="#12437F"/>
  <text x="400" y="207" fill="#FFFFFF" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="3">GRIMUCA AGUA</text>
  <rect x="150" y="218" width="8" height="262" fill="#12437F"/>
  <rect x="642" y="218" width="8" height="262" fill="#12437F"/>

  <!-- Promotor detrás de la mesa -->
  <circle cx="330" cy="290" r="24" fill="#8A5A3C"/>
  <path d="M296 395v-55c0-18 15-30 34-30s34 12 34 30v55z" fill="#2E6DB4"/>
  <!-- Mesa con frente rotulado -->
  <rect x="235" y="372" width="330" height="14" fill="#12437F"/>
  <rect x="250" y="386" width="300" height="94" fill="#FFFFFF" stroke="#12437F" stroke-width="3"/>
  <rect x="250" y="462" width="300" height="18" fill="#C2410C"/>
  <text x="400" y="418" fill="#12437F" font-size="18" font-weight="800" text-anchor="middle">¿Sabes qué toma tu familia?</text>
  <text x="400" y="446" fill="#12437F" font-size="17" text-anchor="middle">Trae un vaso y lo medimos aquí</text>
  <!-- Sobres, tira y vaso sobre la mesa -->
  <g>
    <rect x="250" y="340" width="56" height="34" fill="#FFFFFF" stroke="#12437F" stroke-width="2.5"/>
    <path d="M250 340l28 18 28-18" fill="none" stroke="#12437F" stroke-width="2.5"/>
    <rect x="262" y="330" width="56" height="34" fill="#FFFFFF" stroke="#12437F" stroke-width="2.5" transform="rotate(-8 290 347)"/>
    <rect x="400" y="320" width="8" height="52" fill="#FFFFFF" stroke="#12437F" stroke-width="2"/>
    <g><rect x="401" y="326" width="6" height="6" fill="#C0392B"/><rect x="401" y="336" width="6" height="6" fill="#D4A017"/><rect x="401" y="346" width="6" height="6" fill="#2E7D4F"/><rect x="401" y="356" width="6" height="6" fill="#2E6DB4"/></g>
    <path d="M440 330h34l-5 42h-24z" fill="#D6EAF5" stroke="#12437F" stroke-width="2.5"/>
    <path d="M443 346h28" stroke="#2E6DB4" stroke-width="2"/>
  </g>

  <!-- Vecina con su vaso -->
  <circle cx="610" cy="300" r="22" fill="#5B3A29"/>
  <path d="M582 470l6-120c2-20 14-28 22-28s20 8 22 28l6 120z" fill="#C2410C"/>
  <path d="M584 362l-26 18" stroke="#5B3A29" stroke-width="10" stroke-linecap="round"/>
  <path d="M546 368h22l-3 26h-16z" fill="#D6EAF5" stroke="#12437F" stroke-width="2.5"/>

  <!-- Caballete con aviso -->
  <path d="M686 480l18-110h64l18 110" fill="none" stroke="#12437F" stroke-width="5"/>
  <rect x="690" y="372" width="92" height="70" fill="#FFFFFF" stroke="#12437F" stroke-width="3"/>
  <text x="736" y="397" fill="#12437F" font-size="12" font-weight="800" text-anchor="middle">HOY EN TU</text>
  <text x="736" y="414" fill="#12437F" font-size="12" font-weight="800" text-anchor="middle">URBANIZACIÓN</text>
  <rect x="701" y="422" width="70" height="14" fill="#C2410C"/>
  <text x="736" y="433" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">SOBRE $9</text>

  <text x="400" y="540" fill="#4A5B70" font-size="14" text-anchor="middle">Medición casera orientativa. No reemplaza un análisis de laboratorio.</text>
</svg>
